<div class="register-page">
  <div class="register-container">
    <div class="register-header">
      <h2>Create Account</h2>
      <p>Choose how you want to register</p>
    </div>

    <div class="register-cards">
      <a routerLink="/register/customer" class="register-card">
        <div class="register-card-icon customer-icon">
          <i class="bi bi-person-fill"></i>
        </div>
        <h4>Customer</h4>
        <p>Book hotels, manage reservations, and enjoy travel perks.</p>
        <div class="register-card-arrow">
          <i class="bi bi-arrow-right"></i>
        </div>
      </a>

      <a routerLink="/register/hotel-owner" class="register-card">
        <div class="register-card-icon owner-icon">
          <i class="bi bi-building"></i>
        </div>
        <h4>Hotel Owner</h4>
        <p>List your hotel, manage rooms, and grow your business.</p>
        <div class="register-card-arrow">
          <i class="bi bi-arrow-right"></i>
        </div>
      </a>
    </div>

    <p class="register-switch">Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</div>
