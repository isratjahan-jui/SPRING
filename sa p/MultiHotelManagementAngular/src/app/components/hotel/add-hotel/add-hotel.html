  <div class="container mt-4">
  <h2>Add Hotel</h2>
  <form (ngSubmit)="saveHotel()">
    <div class="mb-2">
      <label class="form-label">Hotel Name</label>
      <input
        [(ngModel)]="hotel.hotelName"
        name="hotelName"
        placeholder="Hotel Name"
        class="form-control"
        required
      />
    </div>
    <div class="mb-2">
      <label class="form-label">Address</label>
      <input
        [(ngModel)]="hotel.address"
        name="address"
        placeholder="Address"
        class="form-control"
        required
      />
    </div>
    <div class="mb-2">
      <label class="form-label">Description</label>
      <textarea
        [(ngModel)]="hotel.description"
        name="description"
        placeholder="Description"
        class="form-control"
      ></textarea>
    </div>
    <div class="mb-2">
      <label class="form-label">Rating</label>
      <input [(ngModel)]="hotel.rating" name="rating" placeholder="Rating" class="form-control" />
    </div>
    <div class="mb-2">
      <label class="form-label">Hotel Image</label>
      <input type="file" class="form-control" accept="image/*" (change)="onFileSelected($event)" />
    </div>
    @if (preview) {
      <div class="mb-2 text-center">
        <img [src]="preview" class="img-thumbnail mt-2" width="200" />
      </div>
    }
    <div class="mb-2">
      <label class="form-label">Location</label>
      @if (locations.length === 0) {
        <div class="alert alert-warning">
          No locations available. Please add locations first via the backend API.
        </div>
      }
      <select [(ngModel)]="hotel.locationId" name="locationId" class="form-select" required>
        <option [ngValue]="0" disabled>Select Location</option>
        @for (loc of locations; track loc.id) {
          <option [ngValue]="loc.id">{{ loc.locationName }}</option>
        }
      </select>
    </div>
    <div class="mb-2">
      <label class="form-label">Payment Type</label>
      <select [(ngModel)]="hotel.paymentType" name="paymentType" class="form-select" required>
        <option value="FULL_ADVANCE">Full Advance (100% at booking)</option>
        <option value="PARTIAL_ADVANCE">Partial Advance (custom % at booking)</option>
        <option value="CASH_ON_STAY">Cash on Stay (pay at hotel)</option>
      </select>
    </div>
    @if (hotel.paymentType === 'PARTIAL_ADVANCE') {
      <div class="mb-2">
        <label class="form-label">Advance Percentage (%)</label>
        <input type="number" [(ngModel)]="hotel.advancePercentage" name="advancePercentage"
               class="form-control" min="1" max="99" placeholder="e.g. 50" />
      </div>
    }
    <button type="submit" class="btn btn-success" [disabled]="!hotel.locationId">Save</button>
  </form>
</div>
